# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
aur = false
author = "Axel H. <noirbizarre@gmail.com>"
bin_name = "shaipe"
categories = "command-line-utilities,multimedia::images"
copyright_holder = "Axel H."
copyright_year = 2026
crate = "shaipe"
description = "An LLM-native SVG asset workspace"
docs = true
docs_accent = "indigo"
homebrew = false
homebrew_tap = "noirbizarre/homebrew-tap"
keywords = "svg,logo,tui,cli,vector"
man_pages = false
msrv = true
msrv_version = "1.90"
owner = "noirbizarre"
publish = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
workspace = false
