# shaipe — An LLM-native SVG asset workspace
#
# Single crate, `[lib]` + `[[bin]]`. The library holds the engine; the binary is
# a thin CLI over it, so integration tests can exercise either.

[package]
name = "shaipe"
version = "0.1.0"
edition = "2024"
# The MSRV. Set by `ratatui-image` -> `icy_sixel` -> `quantette`; nothing else
# in the tree needs anything this recent. Checked by a dedicated CI job, which
# greps this very line — keep it a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.90"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "An LLM-native SVG asset workspace"
repository = "https://github.com/noirbizarre/shaipe"
homepage = "https://noirbizarre.github.io/shaipe/"
documentation = "https://noirbizarre.github.io/shaipe/"
readme = "README.md"
keywords = ["svg", "logo", "tui", "cli", "vector"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "shaipe"
path = "src/main.rs"

[lib]
name = "shaipe"
path = "src/lib.rs"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds these two sections once, at `git tpl init`, and then leaves
# them alone: Dependabot bumps versions here weekly, and a template that
# propagated its own would open a conflict against every one of those PRs.
# Resolve in favour of the project if `git tpl update` ever touches them.

[profile.dev]
# Shaipe's own code is not usually hot, with one exception: converting a
# rasterised pixmap to straight-alpha pixels for the preview is a loop over
# every pixel, and at `opt-level = 0` it cost 37ms for a 512x512 image against
# 2ms optimised. That is the difference between the workspace feeling instant
# and feeling stepped.
#
# Level 1 rather than 3: it recovers essentially all of that, keeps compile
# times and debug information close to an unoptimised build, and does not
# inline the code out from under a debugger.
opt-level = 1

[profile.dev.package."*"]
# `resvg`, `tiny-skia` and `png` do every per-pixel operation in the project,
# and at `opt-level = 0` a debug build rasterises around 25x slower than a
# release one — enough that arrowing through the workspace's variants stutters.
#
# Dependencies only: this crate stays unoptimised, so it compiles quickly and
# steps cleanly in a debugger, and none of the hot code is ours anyway. The
# cost is one slower build, the first time.
opt-level = 3

[dependencies]
# Errors & diagnostics. `thiserror` for typed errors inside the library,
# `miette` to render them at the binary edge.
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Serialisation. Only `inspect --format json` and the tool registry use it:
# the project format itself is XML, because the project format is an SVG.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Rendering. `usvg` parses and resolves, `resvg` rasterises onto a `tiny-skia`
# pixmap. `resvg` re-exports both, but they are named here anyway: the renderer
# uses their types directly and a re-export is not a version contract.
resvg = "0.48.1"
usvg = "0.48.1"
tiny-skia = "0.12.0"
# Named directly only so `Error::Encode` can carry `png::EncodingError` as a
# real `#[source]`. It arrives through `tiny-skia` regardless; keep the version
# in step with whatever `tiny-skia` resolves, or the type stops matching.
png = "0.18.1"

# The metadata layer. `usvg` discards `<metadata>` and every foreign namespace
# while resolving, so Shaipe metadata cannot be read through it and needs its
# own pass over the same bytes. Reading only: metadata is written back by
# splicing over the element's byte range, which `roxmltree` reports, so the
# artwork around it survives untouched and no XML writer is needed.
roxmltree = "0.21.1"

# TUI. `ratatui-image` carries the four terminal graphics protocols and the
# capability query; it is confined to `src/preview/` and named nowhere else.
# See ADR 006 — and note that it is what sets this crate's MSRV, through
# `icy_sixel` -> `quantette`.
#
# Default features are off deliberately: they include `chafa-dyn`, which links
# a system library through `pkg-config` that no CI runner is guaranteed to
# have. Only `crossterm` is needed, matching the backend the TUI drives.
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }

# The prompt editor. This is the ratatui-org fork of `tui-textarea`: the
# original pins `ratatui` back to 0.29, which is why it was ruled out, while
# this builds on `ratatui-core`, which is what `ratatui` 0.30 already resolves
# to. It also soft-wraps, which the original never did and which a pane holding
# prose needs. Default features are the `crossterm` backend and nothing else.
ratatui-textarea = "0.9.2"

# `ratatui-image` speaks `DynamicImage`, so `preview::Image` needs the type to
# hand it one. No codec is enabled: pixels come from `tiny-skia`, never a file.
image = { version = "0.25.10", default-features = false }

# The `render` tool returns its PNG to an agent base64-encoded.
base64 = "0.23.1"

# Warnings the user should see but that must not fail a render — an unresolved
# font family falling back to a system font, most of all.
log = "0.4.33"

# The async runtime. The workspace has to wait on three things at once now —
# the terminal, the renderer and an agent's update stream — and a poll loop
# over three sources is a loop that is always either burning a CPU or late.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
  "io-std",
  "net",
  "process",
] }

# Named directly only for `event-stream`: `ratatui`'s `crossterm` feature does
# not enable it, and the version must stay pinned to whatever `ratatui`
# resolves or two crossterms fight over the same terminal. Everything else
# still goes through `ratatui::crossterm`.
crossterm = { version = "0.29.0", features = ["event-stream"] }

# The ACP client. Shaipe drives an agent the user already installed; it never
# hosts one — see ADR 011.
#
# The crate version and the wire version are independent lines: 2.x speaks
# protocol *v1*, which is what every agent shipping today negotiates. Do not
# enable `unstable_protocol_v2` — it is an unreleased draft, and turning it on
# would make Shaipe speak a dialect nothing answers.
agent-client-protocol = "2.0.0"

# The MCP server, over stdio for a standalone session and over a socket for a
# live workspace. `server` plus the two transports; no `macros` or `schemars`,
# because the tool list is built from `tools::Registry` at runtime rather than
# from types — see ADR 008.
rmcp = { version = "3.1.2", default-features = false, features = [
  "server",
  "transport-io",
  "transport-async-rw",
] }

# Combinators for the event loop's `select!` arms and for the bridge.
futures = "0.3"

# Two unrelated needs, one crate: the scratch file the prompt is handed to
# `$EDITOR` in, and the private directory a live workspace puts its MCP socket
# in so that quitting removes it. A real dependency rather than a dev one since
# the workspace needs it, and still visible to the tests, which is why there is
# no dev entry for it.
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["filters"] }
rstest = "0.26"
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# The MCP tests drive a real client against a real server over an in-process
# duplex stream. Testing the transport with anything less would be testing the
# handler, which is not where protocol bugs live.
rmcp = { version = "3.1.2", default-features = false, features = [
  "client",
  "transport-async-rw",
] }
