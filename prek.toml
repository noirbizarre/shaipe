default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  # Rust files are excluded because `cargo fmt` below already owns their final
  # newline, and two hooks rewriting the same bytes is how a pre-commit run
  # ends up needing a second pre-commit run.
  { id = "end-of-file-fixer", exclude_types = ["rust"] },
  { id = "mixed-line-ending" },
  # Snapshots and fixtures record output verbatim, trailing whitespace
  # included. Trimming it here would fail the tests that assert it.
  { id = "trailing-whitespace", exclude = "^tests/(snapshots/.*\\.snap|fixtures/.*)$" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]

[[repos]]
repo = "local"

# Suppressions are configured in .github/actionlint.yml, not here: the same
# file serves `mise run lint:actions`, so the two cannot disagree.
[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
files = "\\.rs$"
pass_filenames = false

# --- project-specific hooks --------------------------------------------------
#
# Add architecture guards and other project-only hooks below this line. The
# template owns everything above it and will keep updating it; everything here
# is yours, and Git's 3-way merge preserves it across `git tpl update`.
#
# The pattern these projects use is a grep that fails the commit when a
# dependency escapes the module that is supposed to contain it:
#
#   [[repos.hooks]]
#   id = "http-isolation"
#   name = "the HTTP client is confined to the data layer"
#   language = "system"
#   entry = "bash -c '! grep -rnP --include=*.rs \"(?<![A-Za-z0-9_])ureq::\" src | grep -v \"^src/data/\"'"
#   files = "\\.rs$"
#   pass_filenames = false

# --- architecture guards ---
#
# The module boundaries this project is built on, enforced rather than
# described. Each one greps for a real `use` statement: prose in a doc comment
# may still name the other side of a boundary, and rejecting that would only
# teach people to stop writing the comments.

# Rendering is local, deterministic and headless. A renderer that could reach
# the terminal is a renderer that can stop working in CI.
[[repos.hooks]]
id = "renderer-isolation"
name = "the renderer knows nothing about terminals"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use (ratatui|crate::(preview|tui))\" src/render/'"
files = "\\.rs$"
pass_filenames = false

# The preview layer is handed pixels and an area. It must not be able to reach
# a project or the renderer, or a terminal graphics protocol acquires an
# opinion about SVG.
[[repos.hooks]]
id = "preview-isolation"
name = "the preview layer knows nothing about projects"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use crate::(project|render)\" src/preview/'"
files = "\\.rs$"
pass_filenames = false

# ADR 006 depends on `ratatui-image` being swappable, which is only true while
# it is named in one module. `image` goes with it: the only reason that crate
# is here at all is the `DynamicImage` `ratatui-image` speaks.
[[repos.hooks]]
id = "preview-backend-isolation"
name = "the terminal graphics crate is confined to the preview layer"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use (ratatui_image|::?image)\" src --include=*.rs | grep -v \"^src/preview/\"'"
files = "\\.rs$"
pass_filenames = false

# `Stdout` is guarded by a re-entrant lock: re-entrant for the thread holding
# it, blocking for every other one. `ratatui-image` queries the terminal's
# graphics capabilities from a spawned thread, so a lock held across the
# workspace blocks that thread until its timeout expires and the preview
# silently degrades to half-blocks on a terminal that supports Kitty.
#
# That bug shipped once. `stdout().lock()` now appears exactly once, inside
# `write_lines`, which never wraps the TUI.
[[repos.hooks]]
id = "stdout-lock-not-held-across-the-tui"
name = "the stdout lock is taken in one place only"
language = "system"
entry = "bash -c '[ \"$(grep -rl \"[.]lock()\" src --include=*.rs)\" = src/main.rs ]'"
files = "\\.rs$"
pass_filenames = false

# `src/cli/` and `src/main.rs` are the binary. Everything else is the library,
# and the library has to be usable without the CLI.
[[repos.hooks]]
id = "library-knows-no-commands"
name = "nothing in the library knows a command exists"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use clap\" src --include=*.rs | grep -vE \"^src/(cli/|main\\.rs)\"'"
files = "\\.rs$"
pass_filenames = false

# `AgentUpdate` and `ToolOutput` exist to keep two moving protocols out of the
# rest of the tree. They are only doing that job while the protocol crates are
# confined to the modules that adapt them: the moment `SessionUpdate` appears
# in a pane, ACP adding a variant stops compiling the workspace.
[[repos.hooks]]
id = "acp-types-are-confined"
name = "the ACP protocol types do not escape src/acp/"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use agent_client_protocol\" src --include=*.rs | grep -v \"^src/acp/\"'"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "mcp-types-are-confined"
name = "the MCP protocol types do not escape src/mcp/"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use rmcp\" src --include=*.rs | grep -v \"^src/mcp/\"'"
files = "\\.rs$"
pass_filenames = false

# `src/acp/` and `src/mcp/` are adapters around the application layer. A server
# that could reach the workspace would be one that cannot be served headlessly
# by `shaipe mcp`, which is the whole of mode A.
[[repos.hooks]]
id = "adapter-isolation"
name = "the agent and server layers know nothing about the workspace"
language = "system"
entry = "bash -c '! grep -rnE \"^ *use crate::(tui|preview)\" src/acp/ src/mcp/'"
files = "\\.rs$"
pass_filenames = false
