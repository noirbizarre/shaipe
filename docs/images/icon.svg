    </g>
  </symbol><symbol id="wordmark-inverse" viewBox="0 0 800 256">
    <g color="#ffffff">
      <use href="#mark-geometry"/>
      <use href="#letters-geometry"/>
    </g>
  </symbol><use href="#icon"/></svg>
